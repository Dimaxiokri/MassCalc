<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Молярная масса онлайн</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f4f7fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            transition: 0.2s;
        }
        h1 {
            font-weight: 600;
            font-size: 28px;
            color: #1a2634;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .subtitle {
            color: #5e6f7d;
            font-size: 15px;
            margin-bottom: 28px;
            border-left: 4px solid #4a90d9;
            padding-left: 16px;
            background: #f0f4fb;
            border-radius: 0 12px 12px 0;
            line-height: 1.5;
        }
        .input-wrap {
            position: relative;
            margin-bottom: 30px;
        }
        #formulaInput {
            width: 100%;
            padding: 18px 22px;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 2px solid #dce3ec;
            border-radius: 16px;
            background: #fafcff;
            transition: 0.25s ease;
            outline: none;
            color: #1a2634;
            font-family: inherit;
        }
        #formulaInput:focus {
            border-color: #4a90d9;
            box-shadow: 0 0 0 4px rgba(74, 144, 217, 0.15);
            background: #ffffff;
        }
        #formulaInput::placeholder {
            color: #a0b3c9;
            font-weight: 400;
            font-size: 18px;
            letter-spacing: 0;
        }
        .results {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 10px;
        }
        .result-item {
            flex: 1 1 calc(50% - 10px);
            background: #f8faff;
            border-radius: 18px;
            padding: 18px 22px 22px;
            border: 1px solid #e9eef6;
            transition: 0.2s;
        }
        .result-item h3 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #5e6f7d;
            margin-bottom: 6px;
        }
        .result-item .value {
            font-size: 34px;
            font-weight: 600;
            color: #1a2634;
            line-height: 1.2;
            word-break: break-all;
        }
        .result-item .value .unit {
            font-size: 18px;
            font-weight: 400;
            color: #7a8b9e;
            margin-left: 6px;
        }
        .result-item.exact {
            background: #f0f7ff;
            border-color: #c5d8f0;
        }
        .result-item.exact .value {
            color: #0f3b6b;
        }
        .result-item.rounded {
            background: #f5f8f0;
            border-color: #d0dfc5;
        }
        .result-item.rounded .value {
            color: #2a4d2a;
        }
        #errorMsg {
            margin-top: 20px;
            font-size: 15px;
            font-weight: 500;
            min-height: 24px;
            padding: 8px 16px;
            border-radius: 12px;
            background: #fff0f0;
            color: #b33c3c;
            border: 1px solid #ffd6d6;
            display: none;
        }
        #errorMsg.show {
            display: block;
        }
        .hint {
            font-size: 13px;
            color: #8a9aa8;
            margin-top: 16px;
            text-align: center;
            border-top: 1px solid #eef2f7;
            padding-top: 18px;
        }
        .hint kbd {
            background: #eef2f7;
            padding: 2px 10px;
            border-radius: 6px;
            font-weight: 500;
            color: #1a2634;
        }
        @media (max-width: 500px) {
            .container { padding: 24px 18px; }
            .result-item { flex: 1 1 100%; }
            .result-item .value { font-size: 28px; }
            #formulaInput { font-size: 18px; padding: 14px 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚗️ Молярная масса</h1>
    <div class="subtitle">
        Введите формулу — результат обновляется мгновенно
    </div>

    <div class="input-wrap">
        <input type="text" id="formulaInput" placeholder="Например: H2O, Ca, (NH4)2SO4, Fe(OH)3" autofocus spellcheck="false" />
    </div>

    <div class="results">
        <div class="result-item rounded">
            <h3>Округлённая (каждого элемента)</h3>
            <div class="value" id="roundedResult"><span style="color:#9aabbb;">—</span></div>
        </div>
        <div class="result-item exact">
            <h3>Точная</h3>
            <div class="value" id="exactResult"><span style="color:#9aabbb;">—</span></div>
        </div>
    </div>

    <div id="errorMsg"></div>
    <div class="hint">
        Используйте заглавные буквы для элементов, например <kbd>Na</kbd> или <kbd>Fe</kbd>. Поддерживаются скобки и индексы.
    </div>
</div>

<script>
    // ------------------------------------------------------------
    // Атомные массы (средние стандартные) – точность ~4 знака
    // ------------------------------------------------------------
    const atomicMasses = {
        H: 1.008,
        He: 4.0026,
        Li: 6.94,
        Be: 9.0122,
        B: 10.81,
        C: 12.011,
        N: 14.007,
        O: 15.999,
        F: 18.998,
        Ne: 20.180,
        Na: 22.990,
        Mg: 24.305,
        Al: 26.982,
        Si: 28.085,
        P: 30.974,
        S: 32.06,
        Cl: 35.45,
        Ar: 39.948,
        K: 39.098,
        Ca: 40.078,
        Sc: 44.956,
        Ti: 47.867,
        V: 50.942,
        Cr: 51.996,
        Mn: 54.938,
        Fe: 55.845,
        Co: 58.933,
        Ni: 58.693,
        Cu: 63.546,
        Zn: 65.38,
        Ga: 69.723,
        Ge: 72.630,
        As: 74.922,
        Se: 78.971,
        Br: 79.904,
        Kr: 83.798,
        Rb: 85.468,
        Sr: 87.62,
        Y: 88.906,
        Zr: 91.224,
        Nb: 92.906,
        Mo: 95.95,
        Tc: 98,
        Ru: 101.07,
        Rh: 102.91,
        Pd: 106.42,
        Ag: 107.87,
        Cd: 112.41,
        In: 114.82,
        Sn: 118.71,
        Sb: 121.76,
        Te: 127.60,
        I: 126.90,
        Xe: 131.29,
        Cs: 132.91,
        Ba: 137.33,
        La: 138.91,
        Ce: 140.12,
        Pr: 140.91,
        Nd: 144.24,
        Pm: 145,
        Sm: 150.36,
        Eu: 151.96,
        Gd: 157.25,
        Tb: 158.93,
        Dy: 162.50,
        Ho: 164.93,
        Er: 167.26,
        Tm: 168.93,
        Yb: 173.05,
        Lu: 174.97,
        Hf: 178.49,
        Ta: 180.95,
        W: 183.84,
        Re: 186.21,
        Os: 190.23,
        Ir: 192.22,
        Pt: 195.08,
        Au: 196.97,
        Hg: 200.59,
        Tl: 204.38,
        Pb: 207.2,
        Bi: 208.98,
        Po: 209,
        At: 210,
        Rn: 222,
        Fr: 223,
        Ra: 226,
        Ac: 227,
        Th: 232.04,
        Pa: 231.04,
        U: 238.03,
        Np: 237,
        Pu: 244,
        Am: 243,
        Cm: 247,
        Bk: 247,
        Cf: 251,
        Es: 252,
        Fm: 257,
        Md: 258,
        No: 259,
        Lr: 266,
        Rf: 267,
        Db: 268,
        Sg: 269,
        Bh: 270,
        Hs: 277,
        Mt: 278,
        Ds: 281,
        Rg: 282,
        Cn: 285,
        Nh: 286,
        Fl: 289,
        Mc: 290,
        Lv: 293,
        Ts: 294,
        Og: 294
    };

    // Исключения для округления (символ -> значение)
    const roundingExceptions = {
        Cl: 35.5
    };

    // ------------------------------------------------------------
    // Вспомогательные функции
    // ------------------------------------------------------------
    function isUpperCase(ch) { return ch >= 'A' && ch <= 'Z'; }
    function isLowerCase(ch) { return ch >= 'a' && ch <= 'z'; }
    function isDigit(ch) { return ch >= '0' && ch <= '9'; }

    // ------------------------------------------------------------
    // Рекурсивный парсер химических формул
    // Возвращает { elements: { symbol: count }, error: null/string }
    // ------------------------------------------------------------
    function parseFormula(formula) {
        const str = formula.replace(/\s/g, '');
        if (str.length === 0) return { elements: null, error: 'Введите формулу' };

        let i = 0;

        function parseGroup() {
            const result = {};
            while (i < str.length) {
                const ch = str[i];

                if (ch === '(') {
                    i++; // пропускаем '('
                    const sub = parseGroup();
                    if (sub === null) return null;
                    // проверяем индекс после ')'
                    let mult = 1;
                    if (i < str.length && isDigit(str[i])) {
                        let num = '';
                        while (i < str.length && isDigit(str[i])) {
                            num += str[i];
                            i++;
                        }
                        mult = parseInt(num, 10);
                    }
                    // умножаем sub на mult и сливаем с result
                    for (const [el, cnt] of Object.entries(sub)) {
                        result[el] = (result[el] || 0) + cnt * mult;
                    }
                    continue;
                }

                if (ch === ')') {
                    i++; // пропускаем ')'
                    return result;
                }

                if (isUpperCase(ch)) {
                    let symbol = ch;
                    i++;
                    if (i < str.length && isLowerCase(str[i])) {
                        symbol += str[i];
                        i++;
                    }
                    // проверяем индекс
                    let count = 1;
                    if (i < str.length && isDigit(str[i])) {
                        let num = '';
                        while (i < str.length && isDigit(str[i])) {
                            num += str[i];
                            i++;
                        }
                        count = parseInt(num, 10);
                    }
                    // проверяем, что элемент известен
                    if (!(symbol in atomicMasses)) {
                        return { error: `Неизвестный элемент: "${symbol}"` };
                    }
                    result[symbol] = (result[symbol] || 0) + count;
                    continue;
                }

                // недопустимый символ
                return { error: `Недопустимый символ: "${ch}"` };
            }
            return result;
        }

        const result = parseGroup();
        if (result === null) return { elements: null, error: 'Ошибка парсинга' };
        if (result.error) return { elements: null, error: result.error };
        // проверяем, что дошли до конца
        if (i !== str.length) {
            return { elements: null, error: 'Некорректная структура формулы' };
        }
        return { elements: result, error: null };
    }

    // ------------------------------------------------------------
    // Вычисление молярной массы
    // ------------------------------------------------------------
    function calculateMolarMass(elements) {
        let roundedTotal = 0;
        let exactTotal = 0;

        for (const [symbol, count] of Object.entries(elements)) {
            const mass = atomicMasses[symbol];
            if (mass === undefined) {
                return { error: `Неизвестный элемент: "${symbol}"` };
            }
            // Округлённая масса с учётом исключений
            let roundedMass;
            if (symbol in roundingExceptions) {
                roundedMass = roundingExceptions[symbol];
            } else {
                roundedMass = Math.round(mass);
            }
            roundedTotal += roundedMass * count;
            exactTotal += mass * count;
        }

        return {
            rounded: roundedTotal,
            exact: exactTotal
        };
    }

    // ------------------------------------------------------------
    // Обработка ввода
    // ------------------------------------------------------------
    const input = document.getElementById('formulaInput');
    const roundedEl = document.getElementById('roundedResult');
    const exactEl = document.getElementById('exactResult');
    const errorEl = document.getElementById('errorMsg');

    function update() {
        const formula = input.value.trim();
        if (formula === '') {
            roundedEl.innerHTML = '<span style="color:#9aabbb;">—</span>';
            exactEl.innerHTML = '<span style="color:#9aabbb;">—</span>';
            errorEl.classList.remove('show');
            errorEl.textContent = '';
            return;
        }

        const parseResult = parseFormula(formula);
        if (parseResult.error || !parseResult.elements) {
            roundedEl.innerHTML = '<span style="color:#9aabbb;">—</span>';
            exactEl.innerHTML = '<span style="color:#9aabbb;">—</span>';
            errorEl.textContent = parseResult.error || 'Ошибка';
            errorEl.classList.add('show');
            return;
        }

        const massResult = calculateMolarMass(parseResult.elements);
        if (massResult.error) {
            roundedEl.innerHTML = '<span style="color:#9aabbb;">—</span>';
            exactEl.innerHTML = '<span style="color:#9aabbb;">—</span>';
            errorEl.textContent = massResult.error;
            errorEl.classList.add('show');
            return;
        }

        // Округлённая (сумма округлённых масс каждого элемента, с исключениями)
        roundedEl.innerHTML = `${massResult.rounded} <span class="unit">г/моль</span>`;
        // Точная (с 4 знаками)
        exactEl.innerHTML = `${massResult.exact.toFixed(4)} <span class="unit">г/моль</span>`;

        errorEl.classList.remove('show');
        errorEl.textContent = '';
    }

    // Событие ввода (мгновенное обновление)
    input.addEventListener('input', update);

    // Запускаем при загрузке (если есть значение)
    update();
</script>

</body>
</html>
